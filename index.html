<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>服のサイズ診断 — Fit Finder</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap');

/* RESET */
*, *::before, ::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --black:#0a0a0a;
  --white:#fafafa;
  --g100:#f4f4f4;
  --g200:#e8e8e8;
  --g300:#d0d0d0;
  --g400:#aaaaaa;
  --g600:#666666;
  --green:#1a7a4a;
  --green-bg:#e8f7ef;
  --blue:#1a4a8a;
  --blue-bg:#e8eef7;
  --red:#9a2020;
  --red-bg:#f7e8e8;
  --radius:14px;
  --radius-sm:9px;
  --shadow:0 2px 16px rgba(0,0,0,0.07);
  --trans:0.22s ease;
  --sticky-h:80px;
}

body{
  font-family:'DM Sans',sans-serif;
  background:var(--g100);
  color:var(--black);
}

/ 入力 /
input[type="number"], select {
  height:46px;
  border:1.5px solid var(--g200);
  border-radius:var(--radius-sm);
  padding:0 13px;
  font-size:15px;
  background:var(--g100);
  width:100%;
}

/ ボタン */
.btn-diagnose{
  width:100%;
  height:52px;
  background:var(--black);
  color:var(--white);
  border:none;
  border-radius:var(--radius-sm);
  font-weight:700;
  cursor:pointer;
}

.error-inline{
  display:none;
  margin-top:10px;
  color:#cc3333;
}
.error-inline.show{display:block;}

.result-section{
  display:none;
  margin-top:20px;
}
.result-section.show{display:block;}

</style>
</head>

<body>

<h2 style="padding:20px">Fit Finder（簡易版）</h2>

<div style="padding:20px">

  <label>身長</label>
  <input type="number" id="height" placeholder="170">

  <label style="margin-top:10px;display:block;">体重</label>
  <input type="number" id="weight" placeholder="60">

  <button class="btn-diagnose" onclick="diagnose()" style="margin-top:20px;">
    診断する
  </button>

  <div class="error-inline" id="error">入力してください</div>

  <div class="result-section" id="result">
    <p>身幅: <span id="width"></span> cm</p>
    <p>肩幅: <span id="shoulder"></span> cm</p>
  </div>

</div>

<script>
function diagnose(){

  const h = parseFloat(document.getElementById('height').value);
  const w = parseFloat(document.getElementById('weight').value);

  if(isNaN(h) || isNaN(w)){
    document.getElementById('error').classList.add('show');
    return;
  }

  document.getElementById('error').classList.remove('show');

  let width = 54 + (w - 60) * 0.4;
  let shoulder = width * 0.8;

  document.getElementById('width').textContent = Math.round(width);
  document.getElementById('shoulder').textContent = Math.round(shoulder);

  document.getElementById('result').classList.add('show');
}
</script>

</body>
</html>
