<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サイズ診断 v8</title>

<style>
body {
  font-family: sans-serif;
  background:#111;
  color:#fff;
  padding:20px;
}
select, input, button {
  width:100%;
  margin:10px 0;
  padding:10px;
  font-size:16px;
}
.result {
  margin-top:20px;
  padding:15px;
  background:#222;
}
</style>
</head>

<body>

<h2>パンツサイズ診断</h2>

<label>身長(cm)</label>
<input type="number" id="height" value="177">

<label>シルエット</label>
<select id="silhouette">
  <option value="tight">タイト</option>
  <option value="normal">普通</option>
  <option value="wide">ワイド</option>
</select>

<label>股上</label>
<select id="rise">
  <option value="low">ローライズ</option>
  <option value="mid">ミドル</option>
  <option value="high" selected>ハイライズ</option>
</select>

<label>裾位置</label>
<select id="hem">
  <option value="ankle">くるぶし</option>
  <option value="heel" selected>かかと付近</option>
  <option value="shoe">靴に乗る</option>
  <option value="stack">溜める</option>
</select>

<label>脚バランス</label>
<select id="leg">
  <option value="short">短め</option>
  <option value="normal">普通</option>
  <option value="long" selected>長め</option>
</select>

<label>ジャンル</label>
<select id="genre">
  <option value="casual">カジュアル</option>
  <option value="street">ストリート</option>
  <option value="work">ワーク</option>
  <option value="amekaji">アメカジ</option>
  <option value="mode">モード</option>
</select>

<label>素材</label>
<select id="material">
  <option value="normal">通常（±0）</option>
  <option value="denim">デニム（+1）</option>
  <option value="duck">ダック（+2）</option>
  <option value="nylon">ナイロン（-1）</option>
  <option value="wool">ウール（±0）</option>
</select>

<button onclick="calc()">診断する</button>

<div class="result" id="result"></div>

<script>
function calc(){

  const height = Number(document.getElementById('height').value);
  const rise = document.getElementById('rise').value;
  const hem = document.getElementById('hem').value;
  const leg = document.getElementById('leg').value;
  const genre = document.getElementById('genre').value;
  const material = document.getElementById('material').value;

  let corrections = [];

  // ===== 基本股下（ここが最重要修正） =====
  let inseam = (height - 28) * 0.50;

  // ===== 股上補正 =====
  if(rise === 'high'){
    inseam -= 2;
    corrections.push('ハイライズ -2');
  }
  if(rise === 'low'){
    inseam += 2;
    corrections.push('ローライズ +2');
  }

  // ===== 裾位置補正 =====
  if(hem === 'ankle'){
    inseam -= 3;
    corrections.push('くるぶし -3');
  }
  if(hem === 'shoe'){
    inseam += 2;
    corrections.push('靴乗り +2');
  }
  if(hem === 'stack'){
    inseam += 4;
    corrections.push('溜める +4');
  }

  // ===== 脚長補正（超重要） =====
  if(leg === 'long'){
    inseam += 2.5;
    corrections.push('脚長 +2.5');
  }
  if(leg === 'short'){
    inseam -= 2;
    corrections.push('脚短 -2');
  }

  // ===== ジャンル補正 =====
  if(genre === 'street'){
    inseam += 1;
    corrections.push('ストリート +1');
  }
  if(genre === 'mode'){
    inseam -= 1;
    corrections.push('モード -1');
  }

  // ===== 素材補正 =====
  if(material === 'denim'){
    inseam += 1;
    corrections.push('デニム +1');
  }
  if(material === 'duck'){
    inseam += 2;
    corrections.push('ダック +2');
  }
  if(material === 'nylon'){
    inseam -= 1;
    corrections.push('ナイロン -1');
  }

  // ===== 学習補正（ローカル保存） =====
  let history = JSON.parse(localStorage.getItem('inseam_history') || '[]');

  if(history.length > 0){
    const avg = history.reduce((a,b)=>a+b,0)/history.length;
    inseam = (inseam + avg) / 2;
    corrections.push('学習補正');
  }

  inseam = Math.round(inseam);

  // 保存
  history.push(inseam);
  if(history.length > 5) history.shift();
  localStorage.setItem('inseam_history', JSON.stringify(history));

  document.getElementById('result').innerHTML = `
    <h3>結果</h3>
    股下：${inseam}cm<br><br>
    補正：<br>${corrections.join('<br>')}
  `;
}
</script>

</body>
</html>
