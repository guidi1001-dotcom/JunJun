<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>服のサイズ診断 — Fit Finder</title>

<style>
:root {
  --black:#0a0a0a;
  --white:#fafafa;
  --g100:#f4f4f4;
  --g200:#e8e8e8;
  --g300:#d0d0d0;
  --g400:#aaaaaa;
  --g600:#666666;
  --radius:14px;
}

body{
  margin:0;
  font-family:sans-serif;
  background:var(--g100);
  color:var(--black);
}

header{
  background:var(--black);
  color:var(--white);
  text-align:center;
  padding:40px 20px;
}

.wrap{
  max-width:500px;
  margin:auto;
  padding:20px;
}

.section{
  background:#fff;
  border-radius:var(--radius);
  padding:20px;
  margin-bottom:20px;
}

input,button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
  border:1px solid var(--g300);
}

button{
  background:var(--black);
  color:white;
  font-weight:bold;
}

.result{
  background:black;
  color:white;
  padding:20px;
  border-radius:var(--radius);
  margin-top:20px;
}
</style>
</head>

<body>

<header>
<h1>服のサイズ診断</h1>
<p>シンプル版（動作確認用）</p>
</header>

<div class="wrap">

<div class="section">
<label>身長(cm)</label>
<input id="h">

<label>体重(kg)</label>
<input id="w">

<button onclick="calc()">診断する</button>
</div>

<div id="result" class="result" style="display:none"></div>

</div>

<script>
function calc(){
  let h = parseFloat(document.getElementById("h").value);
  let w = parseFloat(document.getElementById("w").value);

  let inseam = Math.round((h-27)0.5);
  let total = inseam + (h0.16);

  document.getElementById("result").style.display="block";
  document.getElementById("result").innerHTML =
    "股下: "+inseam+"cm<br>総丈: "+Math.round(total)+"cm";
}
</script>

</body>
</html>
