<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Fit Finder</title>
</head>

<body>

<h1>Fit Finder</h1>

身長<input id="h"><br>
体重<input id="w"><br>

<button onclick="go()">診断</button>

<p>肩幅：<span id="s"></span></p>

<script>
function go(){
 let h = document.getElementById('h').value;
 let w = document.getElementById('w').value;

 let width = 54 + (w - 60)*0.4;

 document.getElementById('s').textContent = Math.round(width);
}
</script>

</body>
</html>
