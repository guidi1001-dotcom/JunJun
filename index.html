<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>服のサイズ診断</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--black:#0a0a0a;
--white:#fafafa;
--g100:#f4f4f4;
--g200:#e8e8e8;
}

body{
font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
background:var(--g100);
color:var(--black);
}

header{
background:var(--black);
color:var(--white);
padding:40px 20px;
text-align:center;
}

.wrap{
max-width:500px;
margin:auto;
padding:16px;
}

.section{
background:white;
padding:20px;
border-radius:12px;
margin-top:16px;
}

input{
width:100%;
height:45px;
border:1px solid var(--g200);
border-radius:8px;
padding:0 10px;
margin-top:10px;
}

button{
width:100%;
height:50px;
background:black;
color:white;
border:none;
border-radius:8px;
margin-top:20px;
font-weight:bold;
}
</style>
</head>

<body>

<header>
<h1>服のサイズ診断</h1>
</header>

<div class="wrap">

<div class="section">
<label>身長 (cm)</label>
<input type="number" id="h">

<label>体重 (kg)</label>
<input type="number" id="w">

<button onclick="run()">診断する</button>

<p id="r" style="margin-top:15px;"></p>
</div>

</div>

<script>
function run(){
let h=document.getElementById('h').value
let w=document.getElementById('w').value

if(!h||!w){
alert('入力してください')
return
}

let width=54+(w-60)*0.4
document.getElementById('r').innerText='推奨身幅：約 '+Math.round(width)+'cm'
}
</script>

</body>
</html>
