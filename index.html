<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>服のサイズ診断 — Fit Finder</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap');

        /* ===================================================
        RESET & VARIABLES
        =================================================== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --black:    #0a0a0a;
            --white:    #fafafa;
            --g100:     #f4f4f4;
            --g200:     #e8e8e8;
            --g300:     #d0d0d0;
            --g400:     #aaaaaa;
            --g600:     #666666;
            --radius:   16px;
            --radius-sm:10px;
            --shadow:   0 4px 20px rgba(0,0,0,0.08);
            --trans:    0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --sticky-h: 90px;
        }

        html { font-size: 16px; scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
            background: var(--g100);
            color: var(--black);
            min-height: 100vh;
            padding-bottom: calc(var(--sticky-h) + 24px);
            line-height: 1.5;
        }

        /* ===================================================
        HEADER
        =================================================== */
        header {
            background: var(--black); color: var(--white);
            padding: 50px 24px 40px; text-align: center;
        }
        .header-sub {
            font-size: 11px; font-weight: 600;
            letter-spacing: 0.3em; text-transform: uppercase;
            color: rgba(255,255,255,0.4); margin-bottom: 12px;
        }
        header h1 {
            font-family: 'DM Serif Display', serif;
            font-size: clamp(32px, 8vw, 44px);
            letter-spacing: -0.01em; line-height: 1.1;
        }
        header h1 em { font-style: italic; color: rgba(255,255,255,0.5); }
        header p { margin-top: 12px; font-size: 14px; color: rgba(255,255,255,0.45); font-weight: 300; }

        /* ===================================================
        LAYOUT
        =================================================== */
        .wrap { max-width: 500px; margin: 0 auto; padding: 0 20px; }

        /* ===================================================
        SECTION CARD
        =================================================== */
        .section {
            background: var(--white); border-radius: var(--radius);
            box-shadow: var(--shadow); margin-top: 20px; overflow: hidden;
        }
        .section-head {
            padding: 18px 20px; border-bottom: 1px solid var(--g200);
            display: flex; align-items: center; gap: 12px;
        }
        .layer-badge {
            font-size: 10px; font-weight: 700;
            letter-spacing: 0.1em; text-transform: uppercase;
            padding: 4px 10px; border-radius: 100px;
            background: var(--black); color: var(--white); flex-shrink: 0;
        }
        .section-title { font-size: 14px; font-weight: 700; color: var(--black); flex: 1; }
        .section-body  { padding: 24px 20px; }

        /* ===================================================
        FORM ELEMENTS
        =================================================== */
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        .field { display: flex; flex-direction: column; gap: 8px; }
        .field > label {
            font-size: 11px; font-weight: 700;
            letter-spacing: 0.1em; text-transform: uppercase; color: var(--g600);
        }
        .field input[type="number"] {
            height: 52px; border: 1.5px solid var(--g200); border-radius: var(--radius-sm);
            padding: 0 16px; font-family: inherit; font-size: 16px;
            color: var(--black); background: var(--g100); outline: none;
            transition: all var(--trans); width: 100%;
        }
        .field input[type="number"]:focus { border-color: var(--black); background: var(--white); }

        .category-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .cat-btn {
            border: 2px solid var(--g200); border-radius: var(--radius-sm);
            padding: 20px 12px; background: var(--g100);
            cursor: pointer; font-family: inherit;
            display: flex; flex-direction: column; align-items: center; gap: 10px;
            transition: all var(--trans);
        }
        .cat-btn.active { border-color: var(--black); background: var(--black); color: var(--white); }
        .cat-btn .cat-name { font-size: 15px; font-weight: 700; }

        /* ===================================================
        STICKY BUTTON
        =================================================== */
        .sticky-btn-wrap {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000;
            background: rgba(250,250,250,0.9);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-top: 1px solid var(--g200); padding: 16px 20px 30px;
        }
        .btn-diagnose {
            width: 100%; max-width: 460px; margin: 0 auto; height: 56px;
            background: var(--black); color: var(--white);
            border: none; border-radius: 12px;
            font-family: inherit; font-size: 16px; font-weight: 700;
            letter-spacing: 0.15em; cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        /* ===================================================
        RESULT
        =================================================== */
        .result-section {
            display: none; background: var(--white);
            border-radius: var(--radius); box-shadow: var(--shadow);
            margin-top: 24px; overflow: hidden; animation: slideUp 0.5s ease-out;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .result-hero { background: var(--black); color: var(--white); padding: 32px 24px; }
        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .metric { background: rgba(255,255,255,0.07); padding: 18px; border-radius: 12px; }
        .metric-label { font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.4); text-transform: uppercase; }
        .metric-val { font-family: 'DM Serif Display', serif; font-size: 32px; }
    </style>
</head>
<body>

<header>
    <p class="header-sub">Tailored Algorithm</p>
    <h1>Fit Finder<br><em>Size Diagnoser</em></h1>
    <p>ヴィンテージ・ワークウェアを愛する方のためのサイズ計算</p>
</header>

<div class="wrap">
    <div class="section">
        <div class="section-head"><span class="layer-badge">01</span><span class="section-title">基本データ入力</span></div>
        <div class="section-body">
            <div class="form-row">
                <div class="field"><label>身長 (cm)</label><input type="number" id="height" placeholder="177" inputmode="numeric"></div>
                <div class="field"><label>体重 (kg)</label><input type="number" id="weight" placeholder="65" inputmode="numeric"></div>
            </div>
            <div class="field" style="margin-top: 16px;">
                <label>カテゴリ</label>
                <div class="category-toggle">
                    <button class="cat-btn active" id="cat-tops" onclick="selectCategory('tops')"><span class="cat-name">上着</span></button>
                    <button class="cat-btn" id="cat-bottoms" onclick="selectCategory('bottoms')"><span class="cat-name">ボトム</span></button>
                </div>
            </div>
        </div>
    </div>

    <div class="result-section" id="result-section">
        <div class="result-hero">
            <h2 id="r-item-name" style="font-family:'DM Serif Display'; font-size: 26px;">Analysis Results</h2>
            <div class="metrics-grid" id="r-tops-metrics">
                <div class="metric"><span class="metric-label">肩幅</span><br><span class="metric-val" id="r-shoulder">--</span><span style="font-size:12px;opacity:0.6">cm</span></div>
                <div class="metric"><span class="metric-label">身幅</span><br><span class="metric-val" id="r-width">--</span><span style="font-size:12px;opacity:0.6">cm</span></div>
            </div>
            <div class="metrics-grid" id="r-pants-metrics" style="display:none;">
                <div class="metric"><span class="metric-label">ウエスト</span><br><span class="metric-val" id="r-waist">--</span><span style="font-size:12px;opacity:0.6">cm</span></div>
                <div class="metric"><span class="metric-label">股下</span><br><span class="metric-val" id="r-inseam">--</span><span style="font-size:12px;opacity:0.6">cm</span></div>
            </div>
        </div>
    </div>
</div>

<div class="sticky-btn-wrap">
    <button class="btn-diagnose" onclick="diagnose()">診断を開始する</button>
</div>

<script>
    let currentCategory = 'tops';
    function selectCategory(cat) {
        currentCategory = cat;
        document.getElementById('cat-tops').classList.toggle('active', cat === 'tops');
        document.getElementById('cat-bottoms').classList.toggle('active', cat === 'bottoms');
    }

    function diagnose() {
        const h = parseFloat(document.getElementById('height').value) || 177;
        const w = parseFloat(document.getElementById('weight').value) || 65;
        const result = document.getElementById('result-section');
        
        if(currentCategory === 'tops') {
            document.getElementById('r-shoulder').innerText = Math.round(w * 0.4 + 20);
            document.getElementById('r-width').innerText = Math.round(w * 0.5 + 22);
            document.getElementById('r-tops-metrics').style.display = 'grid';
            document.getElementById('r-pants-metrics').style.display = 'none';
        } else {
            document.getElementById('r-waist').innerText = Math.round(w * 0.6 + 40);
            document.getElementById('r-inseam').innerText = Math.round(h * 0.44);
            document.getElementById('r-tops-metrics').style.display = 'none';
            document.getElementById('r-pants-metrics').style.display = 'grid';
        }
        result.style.display = 'block';
        result.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
</script>
</body>
</html>
