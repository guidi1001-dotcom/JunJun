<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サイズ診断 v8</title>

<style>
body {
  font-family: sans-serif;
  background:#111;
  color:#fff;
  padding:20px;
}
select, input, button {
  width:100%;
  margin:10px 0;
  padding:10px;
  font-size:16px;
}
.result {
  margin-top:20px;
  padding:15px;
  background:#222;
}
</style>
</head>

<body>

<h2>パンツサイズ診断</h2>

<label>身長(cm)</label>
<input type="number" id="height" value="177">

<label>股上</label>
<select id="rise">
  <option value="low">ローライズ</option>
  <option value="mid">ミドル</option>
  <option value="high" selected>ハイライズ</option>
</select>

<label>裾位置</label>
<select id="hem">
  <option value="ankle">くるぶし</option>
  <option value="heel" selected>かかと付近</option>
  <option value="shoe">靴に乗る</option>
  <option value="stack">溜める</option>
</select>

<label>脚バランス</label>
<select id="leg">
  <option value="short">短め</option>
  <option value="normal">普通</option>
  <option value="long" selected>長め</option>
</select>

<button onclick="calc()">診断する</button>

<div class="result" id="result"></div>

<script>
function calc(){

  let height = Number(document.getElementById('height').value);
  let rise = document.getElementById('rise').value;
  let hem = document.getElementById('hem').value;
  let leg = document.getElementById('leg').value;

  let inseam = (height - 28) * 0.5;

  if(rise === 'high') inseam -= 2;
  if(rise === 'low') inseam += 2;

  if(hem === 'ankle') inseam -= 3;
  if(hem === 'shoe') inseam += 2;
  if(hem === 'stack') inseam += 4;

  if(leg === 'long') inseam += 2.5;
  if(leg === 'short') inseam -= 2;

  inseam = Math.round(inseam);

  document.getElementById('result').innerHTML =
    "おすすめ股下：" + inseam + " cm";
}
</script>

</body>
</html>
