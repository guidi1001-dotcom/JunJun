<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>服のサイズ診断</title>

<style>

*{box-sizing:border-box;margin:0;padding:0}

:root{

--black:#0a0a0a;

--white:#ffffff;

--g100:#f4f4f4;

--g200:#e8e8e8;

--g400:#aaaaaa;

--radius:14px;

}

body{

font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;

background:var(--g100);

color:var(--black);

}

header{

background:var(--black);

color:var(--white);

padding:40px 20px;

text-align:center;

}

header h1{

font-size:28px;

margin-bottom:5px;

}

.wrap{

max-width:520px;

margin:auto;

padding:16px;

}

.section{

background:var(--white);

border-radius:var(--radius);

padding:20px;

margin-top:16px;

}

.form-row{

display:flex;

gap:10px;

}

input,select{

width:100%;

height:45px;

border:1px solid var(--g200);

border-radius:8px;

padding:0 10px;

}

label{

font-size:12px;

color:var(--g400);

margin-top:10px;

display:block;

}

.category{

display:flex;

gap:10px;

margin-top:10px;

}

.cat-btn{

flex:1;

padding:20px;

border-radius:12px;

border:1px solid var(--g200);

background:#eee;

text-align:center;

cursor:pointer;

}

.cat-btn.active{

background:black;

color:white;

}

button{

width:100%;

height:52px;

background:black;

color:white;

border:none;

border-radius:10px;

margin-top:20px;

font-weight:bold;

}

.result{

margin-top:20px;

padding:15px;

background:white;

border-radius:10px;

line-height:1.6;

}

</style>

</head>

<body>

<header>

<h1>服のサイズ診断</h1>

<p>Fit Finder</p>

</header>

<div class="wrap">

<div class="section">

<div class="form-row">

<div style="flex:1">

<label>身長 (cm)</label>

<input type="number" id="height" placeholder="170">

</div>

<div style="flex:1">

<label>体重 (kg)</label>

<input type="number" id="weight" placeholder="60">

</div>

</div>

<label>性別</label>

<select id="gender">

<option value="male">男性</option>

<option value="female">女性</option>

</select>

<label>カテゴリ</label>

<div class="category">

<div class="cat-btn active" onclick="setCat('tops')" id="topsBtn">上着</div>

<div class="cat-btn" onclick="setCat('bottoms')" id="bottomsBtn">ボトム</div>

</div>

<button onclick="diagnose()">診断する</button>

<div class="result" id="result" style="display:none"></div>

</div>

</div>

<script>

let category="tops"

function setCat(c){

category=c

document.getElementById('topsBtn').classList.remove('active')

document.getElementById('bottomsBtn').classList.remove('active')

if(c==="tops"){

document.getElementById('topsBtn').classList.add('active')

}else{

document.getElementById('bottomsBtn').classList.add('active')

}

}

function diagnose(){

let h=parseFloat(document.getElementById('height').value)

let w=parseFloat(document.getElementById('weight').value)

let gender=document.getElementById('gender').value

if(!h||!w){

alert("入力してください")

return

}

let result=""

if(category==="tops"){

let width=54+(w-60)*0.4

let shoulder=width*0.8+1

let length=72+(h-170)*0.35

let sleeve=60+(h-170)*0.3

let yuki=sleeve+(shoulder/2)

if(yuki<85){

sleeve+=1.5

yuki=sleeve+(shoulder/2)

}

if(gender==="female"){

width-=1

shoulder-=1

}

result=`

トップス推奨サイズ

肩幅：${Math.round(shoulder)}cm

身幅：${Math.round(width)}cm

着丈：${Math.round(length)}cm

袖丈：${Math.round(sleeve)}cm

裄丈：${Math.round(yuki)}cm

`

}else{

let waist=(w*0.45)+10

let inseam=(h-27)*0.5

result=`

ボトム推奨サイズ

ウエスト：${Math.round(waist)}cm

股下：${Math.round(inseam)}cm

`

}

let box=document.getElementById('result')

box.style.display="block"

box.innerHTML=result

}

</script>

</body>

</html>
